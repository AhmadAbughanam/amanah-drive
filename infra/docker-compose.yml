services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      POSTGRES_CONNECTION_STRING: ${POSTGRES_CONNECTION_STRING:?POSTGRES_CONNECTION_STRING is required}
      Auth__JwtIssuer: ${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}
      Auth__JwtAudience: ${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}
      Auth__JwtSigningKey: ${AUTH_JWT_SIGNING_KEY:?AUTH_JWT_SIGNING_KEY is required}
      Auth__BootstrapToken: ${AUTH_BOOTSTRAP_TOKEN:?AUTH_BOOTSTRAP_TOKEN is required}
      Auth__SecureCookies: ${AUTH_SECURE_COOKIES:-true}
      AiService__BaseUrl: ${AI_SERVICE_BASE_URL:-http://ai-service:8000}
      AiService__ServiceToken: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required}
      AiService__WorkerEnabled: "true"
    ports:
      - "${API_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
