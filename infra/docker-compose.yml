name: amanah-drive

services:
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      POSTGRES_CONNECTION_STRING: ${POSTGRES_CONNECTION_STRING:?POSTGRES_CONNECTION_STRING is required}
      Auth__JwtIssuer: ${AUTH_JWT_ISSUER:?AUTH_JWT_ISSUER is required}
      Auth__JwtAudience: ${AUTH_JWT_AUDIENCE:?AUTH_JWT_AUDIENCE is required}
      Auth__JwtSigningKey: ${AUTH_JWT_SIGNING_KEY:?AUTH_JWT_SIGNING_KEY is required}
      Auth__BootstrapToken: ${AUTH_BOOTSTRAP_TOKEN:?AUTH_BOOTSTRAP_TOKEN is required}
      Auth__SecureCookies: ${AUTH_SECURE_COOKIES:-true}
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:3000}
      AiService__BaseUrl: ${AI_SERVICE_BASE_URL:-http://ai-service:8000}
      AiService__ServiceToken: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required}
      AiService__WorkerEnabled: "true"
      LoggingFiles__DirectoryPath: /var/log/amanah-drive
      LoggingFiles__RetainedFileCountLimit: ${API_LOG_RETENTION_FILES:-14}
      LoggingFiles__FileSizeLimitBytes: ${API_LOG_FILE_SIZE_LIMIT_BYTES:-26214400}
      Telemetry__TracingEnabled: ${OTEL_TRACING_ENABLED:-true}
      Telemetry__ServiceName: amanah-drive-api
      Telemetry__OtlpEndpoint: ${OTEL_EXPORTER_OTLP_GRPC_ENDPOINT:-http://jaeger:4317}
    volumes:
      - api_logs:/var/log/amanah-drive
    ports:
      - "${API_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?AI_SERVICE_TOKEN is required}
      HF_API_TOKEN: ${HF_API_TOKEN:?HF_API_TOKEN is required}
      HF_MODEL: ${HF_MODEL:-openai/gpt-oss-20b}
      OTEL_TRACING_ENABLED: ${OTEL_TRACING_ENABLED:-true}
      OTEL_SERVICE_NAME: amanah-drive-ai-service
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_HTTP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
      OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: ${OTEL_EXPORTER_OTLP_TIMEOUT_SECONDS:-5}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  api_logs:
