name: CI/CD

# Single workflow for the whole pipeline: test/build on every push and pull
# request, then — only for a push to main, and only if every test/build job
# above succeeded — publish images to GHCR and deploy them to the VPS.
#
# This is deliberately one file with multiple jobs rather than two separate
# workflow files: `needs:` makes the ordering and the "never deploy failing
# code" guarantee explicit and visible in one place, and every push/PR shows
# up as a single check in GitHub's UI.
#
# The separate .github/workflows/release.yml (triggered by vMAJOR.MINOR.PATCH
# tags) remains its own file — it is a deliberately distinct, manually
# triggered path for numbered releases, documented in docs/RELEASING.md, not
# part of continuous deployment. .github/workflows/codeql.yml also stays
# separate, since CodeQL's own tooling expects to own its workflow.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore api/AmanahDrive.Api.slnx

      - name: Audit NuGet dependencies
        working-directory: api
        run: dotnet list package --vulnerable --include-transitive

      - name: Enforce NuGet critical vulnerability threshold
        working-directory: api
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive --format json > vulnerability-report.json
          critical_count=$(jq '[.. | objects | select(((.severity? // "") | ascii_downcase) == "critical")] | length' vulnerability-report.json)
          if [ "$critical_count" -gt 0 ]; then
            echo "Found $critical_count critical NuGet vulnerability record(s)."
            exit 1
          fi

      - name: Build
        run: dotnet build api/AmanahDrive.Api.slnx --no-restore

      - name: Test
        run: dotnet test api/AmanahDrive.Api.slnx --no-build

  ai-service:
    name: AI Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit==2.9.0

      # pip-audit has no severity threshold, and the current dependency graph has
      # published advisories whose fixed versions are not available on PyPI.
      - name: Audit Python dependencies (report only)
        continue-on-error: true
        working-directory: ai-service
        run: pip-audit -r requirements.txt

      - name: Test
        working-directory: ai-service
        run: pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Audit npm dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Build
        working-directory: web
        run: npm run build

  publish:
    name: Publish ${{ matrix.service }}
    needs: [api, ai-service, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./api
            dockerfile: ./api/Dockerfile
            build_args: ""
          - service: ai-service
            context: ./ai-service
            dockerfile: ./ai-service/Dockerfile
            build_args: ""
          - service: web
            context: ./web
            dockerfile: ./web/Dockerfile
            build_args: NEXT_PUBLIC_API_BASE_URL=${{ vars.RELEASE_WEB_API_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve short SHA
        id: sha
        shell: bash
        run: echo "short=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/amanah-drive-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to VPS
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/amanah-drive
            git fetch origin main
            git reset --hard origin/main
            cd infra
            docker compose --env-file ../.env \
              -f docker-compose.yml \
              -f docker-compose.ghcr.yml \
              -f docker-compose.prod.yml \
              pull
            docker compose --env-file ../.env \
              -f docker-compose.yml \
              -f docker-compose.ghcr.yml \
              -f docker-compose.prod.yml \
              up -d --remove-orphans
            docker image prune -f
