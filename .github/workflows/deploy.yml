name: Deploy

# Runs only after the CI workflow has completed successfully on main — never
# on a failing build/test run. This is the continuous-deployment path;
# .github/workflows/release.yml (triggered by vMAJOR.MINOR.PATCH tags) is the
# separate, deliberate "numbered release" path documented in
# docs/RELEASING.md. This workflow tags images `main` (a moving tag always
# pointing at the latest deployed commit) and `sha-<short-sha>` (a permanent,
# individually pinned tag for every deploy, used for rollback).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.service }}
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./api
            dockerfile: ./api/Dockerfile
            build_args: ""
          - service: ai-service
            context: ./ai-service
            dockerfile: ./ai-service/Dockerfile
            build_args: ""
          - service: web
            context: ./web
            dockerfile: ./web/Dockerfile
            build_args: NEXT_PUBLIC_API_BASE_URL=${{ vars.RELEASE_WEB_API_BASE_URL }}
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve short SHA
        id: sha
        shell: bash
        run: echo "short=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/amanah-drive-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to VPS
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/amanah-drive
            git fetch origin main
            git reset --hard origin/main
            cd infra
            docker compose --env-file ../.env \
              -f docker-compose.yml \
              -f docker-compose.ghcr.yml \
              -f docker-compose.prod.yml \
              pull
            docker compose --env-file ../.env \
              -f docker-compose.yml \
              -f docker-compose.ghcr.yml \
              -f docker-compose.prod.yml \
              up -d --remove-orphans
            docker image prune -f
