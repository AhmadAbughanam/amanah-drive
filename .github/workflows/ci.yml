name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore api/AmanahDrive.Api.slnx

      - name: Audit NuGet dependencies
        working-directory: api
        run: dotnet list package --vulnerable --include-transitive

      - name: Enforce NuGet critical vulnerability threshold
        working-directory: api
        shell: bash
        run: |
          dotnet list package --vulnerable --include-transitive --format json > vulnerability-report.json
          critical_count=$(jq '[.. | objects | select(((.severity? // "") | ascii_downcase) == "critical")] | length' vulnerability-report.json)
          if [ "$critical_count" -gt 0 ]; then
            echo "Found $critical_count critical NuGet vulnerability record(s)."
            exit 1
          fi

      - name: Build
        run: dotnet build api/AmanahDrive.Api.slnx --no-restore

      - name: Test
        run: dotnet test api/AmanahDrive.Api.slnx --no-build

  ai-service:
    name: AI Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit==2.9.0

      # pip-audit has no severity threshold, and the current dependency graph has
      # published advisories whose fixed versions are not available on PyPI.
      - name: Audit Python dependencies (report only)
        continue-on-error: true
        working-directory: ai-service
        run: pip-audit -r requirements.txt

      - name: Test
        working-directory: ai-service
        run: pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Audit npm dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Build
        working-directory: web
        run: npm run build
