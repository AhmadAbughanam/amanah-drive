name: CI

on:
  push:
  pull_request:

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore api/AmanahDrive.Api.slnx

      - name: Build
        run: dotnet build api/AmanahDrive.Api.slnx --no-restore

      - name: Test
        run: dotnet test api/AmanahDrive.Api.slnx --no-build

  ai-service:
    name: AI Service
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt

      - name: Test
        working-directory: ai-service
        run: pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Build
        working-directory: web
        run: npm run build
